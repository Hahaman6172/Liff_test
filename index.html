<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport"
		content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,viewport-fit=cover">
	<title>My LIFF App3</title>
	<style>
		button {
			display: none;
			width: 50%;
			height: 10%;
			padding: 16px 0;
			margin: auto 0;
		}
	</style>
</head>

<body>
	<button id="btnShare" onclick="sendShare_Gift()" style="display: none;margin: 20px auto;padding: 20px;">Gift</button>
	<button id="btnShare3" onclick="sendShare_Pay()" style="display: none;margin: 20px auto;padding: 20px;">Pay</button>
	<button id="btnShare4" onclick="sendShare_RedPacket()" style="display: none;margin: 20px auto;padding: 20px;">Red Packet</button>
	<button id="btnLogin" onclick="liff.login()" style="display: none;margin: 20px auto;padding: 20px;">Log In</button>
	<button id="btnLogOut" onclick="logOut()" style="display: none;margin: 20px auto;padding: 20px;">Log Out</button>

	<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
	<script>
		// ====== LIFF 設定 ======
		const MAIN_LIFF_ID = "2008946084-6uzbZvVO";
		const SEND_LIFF_ID = "2009663113-ZC8oQd6E";

		// ====== A / B / C 內容設定 ======
		// mode: "text" 或 "image"

		const PRESET_A = {
			mode: "text",
			text: "我超笨 活該被騙",
			image: "https://i.meee.com.tw/K4zKfbe.jpg"
		};

		const PRESET_B = {
			mode: "image",
			text: "我超笨 活該被騙",
			image: "https://i.meee.com.tw/K4zKfbe.jpg"
		};

		const PRESET_C = {
			mode: "image",
			text: "我超笨 活該被騙",
			image: "https://i.meee.com.tw/VfFO7Mj.jpg"
		};

		// ====== Gift / Pay / Red Packet 快速切換 ======
		const GIFT_PRESET = "A";
		const PAY_PRESET = "B";
		const REDPACKET_PRESET = "C";

		function buildSendUrl(params) {
			return "https://liff.line.me/" + SEND_LIFF_ID + "?" + new URLSearchParams(params).toString();
		}

		function getPresetConfig(presetName) {
			if (presetName === "B") return PRESET_B;
			if (presetName === "C") return PRESET_C;
			return PRESET_A;
		}

		function buildParamsFromPreset(presetName) {
			const preset = getPresetConfig(presetName);

			if (preset.mode === "image") {
				return {
					image: preset.image
				};
			}

			return {
				text: preset.text
			};
		}

		async function sendShare_Gift() {
			const name = await liff.getProfile().then((profile) => {
				return profile.displayName;
			}).catch((err) => {
				return "朋友";
			});

			const giftParams = buildParamsFromPreset(GIFT_PRESET);

			const giftOpenUrl = buildSendUrl(giftParams);
			const thanksCardUrl = buildSendUrl(giftParams);
			const lineGiftUrl = buildSendUrl(giftParams);

			const result = await liff.shareTargetPicker([
				{
					"type": "flex",
					"altText": name + "送禮物來囉!",
					"contents": {
						"type": "bubble",
						"size": "kilo",
						"hero": {
							"type": "image",
							"url": "https://i.meee.com.tw/g5p11A2.jpg",
							"size": "full",
							"aspectRatio": "18:19",
							"action": {
								"type": "uri",
								"label": "action",
								"uri": giftOpenUrl
							},
							"margin": "none",
							"align": "center",
							"aspectMode": "cover"
						},
						"body": {
							"type": "box",
							"layout": "horizontal",
							"spacing": "none",
							"action": {
								"type": "uri",
								"label": "action",
								"uri": giftOpenUrl
							},
							"contents": [
								{
									"type": "image",
									"url": "https://img.onl/pNQsvU",
									"align": "start",
									"size": "md",
									"action": {
										"type": "uri",
										"label": "action",
										"uri": giftOpenUrl
									},
									"position": "relative"
								},
								{
									"type": "text",
									"text": "【星巴克】大杯巧克力可可碎片星冰樂雙杯組",
									"size": "md",
									"weight": "bold",
									"margin": "none",
									"align": "start",
									"offsetTop": "xxl",
									"contents": [],
									"style": "normal",
									"wrap": true,
									"action": {
										"type": "uri",
										"label": "action",
										"uri": giftOpenUrl
									},
									"position": "relative"
								}
							],
							"margin": "none",
							"position": "relative"
						},
						"footer": {
							"type": "box",
							"layout": "vertical",
							"contents": [
								{
									"type": "button",
									"color": "#EEE9E9",
									"margin": "none",
									"action": {
										"type": "uri",
										"label": "打開我的禮物",
										"uri": giftOpenUrl
									},
									"style": "secondary"
								},
								{
									"type": "button",
									"action": {
										"type": "uri",
										"label": "傳送感謝小卡",
										"uri": thanksCardUrl
									}
								},
								{
									"type": "separator"
								},
								{
									"type": "box",
									"layout": "vertical",
									"contents": [
										{
											"type": "button",
											"action": {
												"type": "uri",
												"label": "LINE禮物",
												"uri": lineGiftUrl
											},
											"position": "relative",
											"margin": "none",
											"height": "sm",
											"style": "link"
										}
									],
									"action": {
										"type": "uri",
										"label": "action",
										"uri": lineGiftUrl
									}
								}
							]
						}
					}
				}
			]);

			if (result) {
				alert(`[${result.status}] Message sent!`);
			} else {
				const [majorVer, minorVer, patchVer] = (liff.getLineVersion() || "").split('.');

				if (minorVer === undefined) {
					alert('ShareTargetPicker was canceled in external browser');
					return;
				}

				if (parseInt(majorVer) >= 10 && parseInt(minorVer) >= 10 && parseInt(patchVer) > 0) {
					alert('ShareTargetPicker was canceled in LINE app');
				}
			}
		}

		async function sendShare_Pay() {
			const name = await liff.getProfile().then((profile) => {
				return profile.displayName;
			}).catch((err) => {
				return "朋友";
			});

			const payParams = buildParamsFromPreset(PAY_PRESET);
			const payInfoUrl = buildSendUrl(payParams);

			const result = await liff.shareTargetPicker([
				{
					"type": "flex",
					"altText": "已收到NT$ 100的轉帳。",
					"contents": {
						"type": "bubble",
						"size": "hecto",
						"hero": {
							"type": "image",
							"url": "https://i.imgur.com/j5VkCxE.png",
							"size": "full",
							"aspectRatio": "20:13",
							"aspectMode": "cover",
							"action": {
								"type": "uri",
								"uri": payInfoUrl
							},
							"position": "relative"
						},
						"body": {
							"type": "box",
							"layout": "vertical",
							"contents": [
								{
									"type": "text",
									"text": "LINE Pay",
									"weight": "bold",
									"size": "xs",
									"action": {
										"type": "uri",
										"label": "action",
										"uri": payInfoUrl
									}
								},
								{
									"type": "text",
									"text": "您已收到 NT$ 100。（來自：" + name + "）",
									"size": "xs",
									"contents": [],
									"color": "#8E8E8E",
									"action": {
										"type": "uri",
										"label": "action",
										"uri": payInfoUrl
									}
								},
								{
									"type": "button",
									"position": "relative",
									"style": "secondary",
									"height": "sm",
									"margin": "lg",
									"color": "#F0F0F0",
									"action": {
										"type": "uri",
										"label": "瞭解更多",
										"uri": payInfoUrl
									},
									"scaling": true
								}
							],
							"action": {
								"type": "uri",
								"label": "action",
								"uri": payInfoUrl
							}
						},
						"footer": {
							"type": "box",
							"layout": "baseline",
							"contents": [
								{
									"type": "icon",
									"url": "https://i.imgur.com/LriSrg0.png",
									"margin": "none",
									"size": "xs",
									"scaling": true,
									"offsetTop": "xs"
								},
								{
									"type": "text",
									"text": "LINE Pay",
									"margin": "sm",
									"size": "xxs",
									"color": "#8E8E8E"
								},
								{
									"type": "icon",
									"url": "https://i.imgur.com/aKbXQ9D.png",
									"margin": "sm",
									"size": "xxs",
									"offsetTop": "xs"
								}
							],
							"action": {
								"type": "uri",
								"label": "action",
								"uri": payInfoUrl
							},
							"position": "relative"
						},
						"styles": {
							"footer": {
								"separator": true
							}
						}
					}
				}
			]);

			if (result) {
				alert(`[${result.status}] Message sent!`);
			} else {
				const [majorVer, minorVer, patchVer] = (liff.getLineVersion() || "").split('.');

				if (minorVer === undefined) {
					alert('ShareTargetPicker was canceled in external browser');
					return;
				}

				if (parseInt(majorVer) >= 10 && parseInt(minorVer) >= 10 && parseInt(patchVer) > 0) {
					alert('ShareTargetPicker was canceled in LINE app');
				}
			}
		}

		async function sendShare_RedPacket() {
			const redPacketParams = buildParamsFromPreset(REDPACKET_PRESET);
			const redPacketUrl = buildSendUrl(redPacketParams);

			const result = await liff.shareTargetPicker([
				{
					"type": "flex",
					"altText": "LINE Pay 紅包",
					"contents": {
						"type": "bubble",
						"size": "kilo",
						"hero": {
							"type": "image",
							"url": "https://i.meee.com.tw/1ch0tYl.jpg",
							"size": "full",
							"aspectRatio": "20:13",
							"aspectMode": "cover",
							"action": {
								"type": "uri",
								"uri": redPacketUrl
							}
						},
						"body": {
							"type": "box",
							"layout": "vertical",
							"spacing": "sm",
							"contents": [
								{
									"type": "text",
									"text": "LINE Pay 紅包",
									"weight": "bold",
									"size": "lg",
									"color": "#333333"
								},
								{
									"type": "text",
									"text": "您發了 2 個紅包到聊天室。先搶先贏，立即打開紅包！",
									"wrap": true,
									"size": "sm",
									"color": "#666666"
								}
							],
							"action": {
								"type": "uri",
								"uri": redPacketUrl
							}
						},
						"footer": {
							"type": "box",
							"layout": "vertical",
							"contents": [
								{
									"type": "button",
									"style": "link",
									"height": "sm",
									"action": {
										"type": "uri",
										"label": "查看紅包狀態",
										"uri": redPacketUrl
									}
								}
							]
						}
					}
				}
			]);

			if (result) {
				alert(`[${result.status}] Message sent!`);
			} else {
				const [majorVer, minorVer, patchVer] = (liff.getLineVersion() || "").split('.');

				if (minorVer === undefined) {
					alert('ShareTargetPicker was canceled in external browser');
					return;
				}

				if (parseInt(majorVer) >= 10 && parseInt(minorVer) >= 10 && parseInt(patchVer) > 0) {
					alert('ShareTargetPicker was canceled in LINE app');
				}
			}
		}

		function logOut() {
			liff.logout();
			window.location.reload();
		}

		async function main() {
			await liff.init({ liffId: MAIN_LIFF_ID });

			if (liff.isLoggedIn()) {
				document.getElementById("btnShare").style.display = "block";
				document.getElementById("btnShare3").style.display = "block";
				document.getElementById("btnShare4").style.display = "block";

				if (!liff.isInClient()) {
					document.getElementById("btnLogOut").style.display = "block";
				}
			} else {
				document.getElementById("btnLogin").style.display = "block";
			}
		}

		main();
	</script>
</body>

</html>
